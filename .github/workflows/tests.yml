name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install check tools
        run: python -m pip install ".[lint]"
      - name: Lint package and tests
        run: python -m ruff check ntu_cool_materials tests
      - name: Type-check core
        run: python -m mypy
      - name: Check core import direction
        run: python -m unittest discover -s tests -p test_core_imports.py

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: pip install -e .
      - name: Run unit tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v
